<style>
  :root{
    --brand:#F2701C;
    --brand-dark:#C85812;
    --brand-soft:rgba(242,113,28,0.12);
    --gold:#8A5A00;
    --gold-soft:rgba(184,134,11,0.16);
    --cream:#F6F1E7;
    --cream-alt:#ECE3D0;
    --ink:#2E2013;
    --ink-soft:#6B5A47;
    --line:#E3D9C7;
    --shadow:0 2px 10px rgba(46,32,19,0.08);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream); color:var(--ink); min-height:100vh;
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-weight:700;
  }
  h1,h2,h3,h4{font-family:'Gowun Dodum','Noto Sans KR',sans-serif; margin:0; font-weight:700;}
  .wrap{max-width:640px; margin:0 auto; padding:0 18px 60px;}

  .hero{
    background:linear-gradient(160deg,var(--brand),var(--brand-dark));
    color:#FFF3E8; padding:40px 24px 46px; text-align:center; position:relative; overflow:hidden;
    border-radius:0 0 28px 28px; margin:0 -18px 28px;
  }
  .hero::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 82% -10%, rgba(255,255,255,0.20), transparent 55%);}
  .hero .eyebrow{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,243,232,0.92); font-family:'Pretendard',sans-serif; font-weight:800; position:relative;}
  .hero h1{font-size:26px; color:#fff; margin-top:8px; position:relative;}
  .hero .sub{margin-top:10px; font-size:13.5px; color:rgba(255,243,232,0.94); font-family:'Noto Sans KR',sans-serif; font-weight:500; position:relative;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:26px 24px; margin-bottom:20px;
  }
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12.5px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; font-weight:700;}
  .field input{
    padding:12px 14px; border:1px solid var(--line); border-radius:8px; font-size:15px;
    font-family:'Noto Sans KR',sans-serif; font-weight:500; background:var(--cream); color:var(--ink);
  }
  .field input:focus{outline:none; border-color:var(--brand);}
  .btn{
    width:100%; background:var(--brand); color:#fff; border:none; padding:13px 18px; border-radius:9px;
    font-size:15px; font-family:'Noto Sans KR',sans-serif; font-weight:700; cursor:pointer; transition:background .15s;
  }
  .btn:hover{background:var(--brand-dark);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line); margin-top:10px;}
  .error-msg{color:#B8391F; font-size:13px; font-family:'Noto Sans KR',sans-serif; font-weight:600; margin-top:4px; min-height:18px;}
  .login-note{font-size:12.5px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; font-weight:500; text-align:center; margin-top:6px; line-height:1.6;}

  .report-head{text-align:center; margin-bottom:22px; padding-bottom:16px; border-bottom:2px solid var(--brand-soft);}
  .report-head .academy{font-size:11px; letter-spacing:2px; color:var(--ink-soft); text-transform:uppercase; font-family:'Noto Sans KR',sans-serif;}
  .report-head h2{font-size:21px; margin-top:6px;}
  .report-head .meta{font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-family:'Space Mono',monospace;}
  .report-section{margin-bottom:22px;}
  .report-section h4{font-size:14px; color:var(--brand-dark); margin-bottom:10px;}
  .report-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px 20px; font-size:13.5px; font-family:'Noto Sans KR',sans-serif; font-weight:500;}
  .report-grid .label{color:var(--ink-soft); font-size:11.5px; display:block; margin-bottom:2px;}
  .report-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .report-list li{background:var(--cream-alt); border-radius:8px; padding:9px 13px; font-size:13px; font-family:'Noto Sans KR',sans-serif; font-weight:500;}
  .report-list li.strong-item{background:var(--brand-soft); color:var(--brand-dark);}
  .report-list li.grow-item{background:var(--gold-soft); color:var(--gold);}
  .report-empty{color:var(--ink-soft); font-size:13px; font-family:'Noto Sans KR',sans-serif; font-weight:500;}
  .comment-box{
    border:1px dashed var(--line); border-radius:8px; padding:14px 16px; min-height:60px;
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif; font-size:14px; background:var(--cream); color:var(--ink);
    white-space:pre-wrap; line-height:1.6;
  }
  .loading{text-align:center; padding:40px 0; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; font-weight:500;}

  .sibling-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; justify-content:center;}
  .sibling-tab{padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:700; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; cursor:pointer;}
  .sibling-tab.active{background:var(--brand); border-color:var(--brand); color:#fff;}

  .msg-textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; box-sizing:border-box;
    font-family:'Noto Sans KR',sans-serif; font-size:13.5px; min-height:70px; resize:vertical;
    background:var(--cream); color:var(--ink);
  }
  .msg-status{font-size:12px; color:var(--ink-soft); margin-top:6px; font-family:'Noto Sans KR',sans-serif; font-weight:500; min-height:16px;}
  .msg-history-item{background:var(--cream-alt); border-radius:8px; padding:9px 12px; font-size:12.5px; font-family:'Noto Sans KR',sans-serif; font-weight:500; color:var(--ink);}
  .msg-history-date{font-size:10.5px; color:var(--ink-soft); font-family:'Space Mono',monospace; display:block; margin-bottom:3px;}

  .tap-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .tap-num-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); font-family:'Space Mono',monospace; font-size:13px; font-weight:700;
    transition:background .15s, border-color .15s, color .15s;
  }
  .tap-num-btn:hover{border-color:var(--brand);}
  .tap-num-btn.wrong{background:#B8391F; border-color:#B8391F; color:#fff;}
  .hw-self-input{
    width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-family:'Noto Sans KR',sans-serif; font-size:13.5px; background:var(--cream); color:var(--ink); margin-bottom:8px;
  }
  .ak-input-row{display:flex; align-items:center; gap:8px;}
  .ak-input-row .ak-num{width:32px; font-weight:700; font-family:'Space Mono',monospace; font-size:13px; color:var(--ink-soft); flex-shrink:0;}
  .ak-input-row input{flex:1;}

  /* ── 🧩 개념빈칸 테스트 ── */
  .cq-week-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:10px;}
  .cq-week-count{font-size:22px; font-weight:800; color:var(--brand-dark); font-family:'Space Mono',monospace;}
  .cq-week-count span{font-size:13px; color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; font-weight:700;}
  .cq-dots{display:flex; gap:6px;}
  .cq-dot{width:13px; height:13px; border-radius:50%; border:2px solid var(--brand); background:transparent;}
  .cq-dot.filled{background:var(--brand);}
  .cq-status{font-size:12.5px; font-family:'Noto Sans KR',sans-serif; font-weight:600; padding:8px 11px; border-radius:8px; margin-bottom:12px;}
  .cq-status.ok{background:var(--brand-soft); color:var(--brand-dark);}
  .cq-status.pending{background:var(--gold-soft); color:var(--gold);}
  .cq-empty{color:var(--ink-soft); font-size:13px; font-family:'Noto Sans KR',sans-serif; font-weight:500;}

  .cq-progress-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cq-progress-bar{flex:1; height:6px; background:var(--cream-alt); border-radius:5px; overflow:hidden;}
  .cq-progress-bar > i{display:block; height:100%; background:var(--brand); border-radius:5px; transition:width .25s ease;}
  .cq-progress-num{font-size:11.5px; font-weight:700; color:var(--ink-soft); font-family:'Space Mono',monospace; white-space:nowrap;}

  .cq-tag{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--cream-alt); color:var(--ink-soft); font-family:'Noto Sans KR',sans-serif; margin-right:6px; margin-bottom:10px;}
  .cq-tag.review{background:var(--gold-soft); color:var(--gold);}

  .cq-question{font-size:15.5px; line-height:1.7; font-weight:700; color:var(--ink); margin-bottom:16px; font-family:'Gowun Dodum','Noto Sans KR',sans-serif;}
  .cq-blank{display:inline-block; min-width:52px; border-bottom:2.5px solid var(--brand); color:var(--brand-dark);}

  .cq-options{display:flex; flex-direction:column; gap:9px;}
  .cq-option{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:12px 14px; border-radius:10px; border:2px solid var(--line); background:var(--cream);
    font-size:14.5px; font-weight:700; color:var(--ink); font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
  }
  .cq-option .cq-mark{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line); background:#fff;
    flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink-soft);
  }
  .cq-option.locked{cursor:default;}
  .cq-option.is-correct{border-color:#B8391F; background:rgba(184,57,31,0.09); color:#B8391F;}
  .cq-option.is-correct .cq-mark{background:#B8391F; border-color:#B8391F; color:#fff;}
  .cq-option.is-wrong-pick{border-color:var(--ink); background:var(--cream-alt); color:var(--ink);}
  .cq-option.is-wrong-pick .cq-mark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .cq-option.dimmed{opacity:0.4;}

  .cq-feedback{margin-top:13px; padding:11px 13px; border-radius:9px; font-size:13px; font-weight:700; font-family:'Noto Sans KR',sans-serif; display:flex; align-items:center; gap:8px;}
  .cq-feedback.ok{background:var(--brand-soft); color:var(--brand-dark);}
  .cq-feedback.no{background:rgba(184,57,31,0.09); color:#8C241C;}
  .cq-feedback .cq-student-answer{font-weight:800; color:#1B1208; background:var(--cream-alt); padding:1px 7px; border-radius:6px;}
  .cq-feedback .cq-correct-answer{font-weight:800; color:#B8391F; background:rgba(184,57,31,0.12); padding:1px 7px; border-radius:6px;}

  .cq-nav{display:flex; gap:8px; margin-top:16px;}
  .cq-nav .btn{margin-top:0;}

  .cq-summary-item{border-radius:9px; padding:11px 13px; margin-bottom:8px; font-size:13px; font-family:'Noto Sans KR',sans-serif; font-weight:600;}
  .cq-summary-item.correct{background:var(--brand-soft); border-left:3px solid var(--brand);}
  .cq-summary-item.wrong{background:rgba(184,57,31,0.08); border-left:3px solid #B8391F;}

  @media (max-width:480px){
    .report-grid{grid-template-columns:1fr;}
  }

  /* 🧠 AI 학습 성향 분석 리포트 */
  .airp-cert{ background:linear-gradient(180deg,#FFFDF9,#FFF7EF); border:1px solid var(--line); border-radius:var(--radius); padding:20px; text-align:center; margin-bottom:14px; }
  .airp-cert .who{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .airp-grid-2{ display:grid; grid-template-columns:1.1fr 1fr; gap:14px; }
  @media(max-width:640px){ .airp-grid-2{ grid-template-columns:1fr; } }
  .airp-donut-wrap{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .airp-legend{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:8px; }
  .airp-legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-family:'Noto Sans KR',sans-serif; font-weight:600; }
  .airp-dot{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .airp-legend-item .pct{ margin-left:auto; font-family:'Space Mono',monospace; font-weight:700; }
  .airp-sw-title{ font-size:12.5px; font-weight:700; margin:12px 0 8px; font-family:'Noto Sans KR',sans-serif; }
  .airp-sw-title.good{ color:#1E7A5F; }
  .airp-sw-title.risk{ color:#B4472B; }
  .airp-sw-list{ list-style:none; margin:0 0 4px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .airp-sw-list li{ font-size:12.5px; line-height:1.55; padding:9px 11px; border-radius:8px; font-family:'Noto Sans KR',sans-serif; font-weight:500; }
  .airp-sw-list.good li{ background:#F0FAF6; border:1px solid #BFE6D6; }
  .airp-sw-list.risk li{ background:#FDF1EE; border:1px solid #F3CFC4; }
  .airp-analysis p{ font-size:13.5px; line-height:1.7; margin:0 0 12px; font-family:'Noto Sans KR',sans-serif; font-weight:500; }
  .airp-analysis p:last-child{ margin-bottom:0; }
  .airp-sol-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:480px){ .airp-sol-grid{ grid-template-columns:1fr; } }
  .airp-sol-card{ background:var(--cream-alt); border-radius:10px; padding:14px 16px; }
  .airp-sol-card .lbl{ display:inline-block; font-size:11px; font-weight:800; color:var(--brand-dark); background:var(--brand-soft); padding:3px 10px; border-radius:100px; margin-bottom:8px; }
  .airp-sol-card p{ margin:0; font-size:12.8px; font-family:'Noto Sans KR',sans-serif; font-weight:500; line-height:1.55; }
  .airp-parent-item{ display:flex; gap:12px; margin-bottom:12px; align-items:flex-start; }
  .airp-parent-item:last-child{ margin-bottom:0; }
  .airp-pnum{ width:22px; height:22px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; flex-shrink:0; }
  .airp-parent-item p{ margin:0; font-size:12.8px; font-family:'Noto Sans KR',sans-serif; font-weight:500; padding-top:1px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">FIND YOUR GREATNESS</div>
    <h1>아임수학학원</h1>
    <div class="sub">학부모·학생 전용 리포트 조회</div>
  </div>

  <div id="loginView">
    <div class="card">
      <form id="loginForm" onsubmit="login(event)">
        <div class="field">
          <label for="login-name">학생 이름</label>
          <input type="text" id="login-name" placeholder="예: 김민준" required>
        </div>
        <div class="field">
          <label for="login-pin">비밀번호(핸드폰끝뒷4자리)</label>
          <input type="password" id="login-pin" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="예: 1234" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">확인</button>

function escapeHtml(str){

}

function levelOf(grade){
  if(!grade) return '';

let serverChecked_ = false;
async function checkServer_(){
  if(serverChecked_) return;
  let data = null;
  try {
    const sep = API_URL.includes('?') ? '&' : '?';
    const res = await fetch(API_URL + sep + 'probe=1', { method:'GET' });
    data = await res.json();
  } catch(err){
    throw portalError_('NETWORK', '서버에 연결하지 못했어요. 인터넷 연결을 확인하시고 잠시 후 다시 시도해주세요.');
  }
  if(!data || data.api !== 2 || !data.migrated){
    throw portalError_('MAINTENANCE', '학원 시스템을 점검하고 있어요. 잠시 후 다시 시도해주세요.');
  }
  serverChecked_ = true;
}

async function portalApi_(action, payload){
  await checkServer_();
  let res;
  try {
    res = await fetch(API_URL, {
      method:'POST',
      headers: { 'Content-Type':'text/plain' },
      body: JSON.stringify(Object.assign({ v: 2, clientVersion: PORTAL_CLIENT_VERSION, action }, payload || {}))
    });
  } catch(err){
    throw portalError_('NETWORK', '서버에 연결하지 못했어요. 인터넷 연결을 확인하시고 잠시 후 다시 시도해주세요.');
  }
  let data;
  try { data = await res.json(); } catch(err){ throw portalError_('BAD_RESPONSE', '서버 응답을 읽지 못했어요. 잠시 후 다시 시도해주세요.'); }
  if(!data || data.ok !== true){
    const code = data && data.error;
    if(code === 'SESSION_EXPIRED' || code === 'AUTH_REQUIRED'){
      clearParentSession_();
      showLoginView_(data.message);
    }
    throw portalError_(code || 'ERROR', (data && data.message) || '요청을 처리하지 못했어요.');
  }
  return data;
}

}

function buildScoreChartSVG(tests, groupAvg){
  const w = 560, h = 200, padL = 38, padR = 18, padT = 18, padB = 34;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const n = tests.length;
  const xAt = i => n <= 1 ? padL + chartW / 2 : padL + (chartW * i / (n - 1));
  const yAt = score => padT + chartH - (score / 100 * chartH);

  const gridLines = [0, 50, 100].map(v => `
    <line x1="${padL}" y1="${yAt(v)}" x2="${w - padR}" y2="${yAt(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL - 8}" y="${yAt(v) + 4}" font-size="10.5" text-anchor="end" fill="var(--ink-soft)" font-family="'Space Mono',monospace">${v}</text>
  `).join('');

  const pathD = tests.map((t, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(t.score).toFixed(1)}`).join(' ');

  const points = tests.map((t, i) => `
    <circle cx="${xAt(i).toFixed(1)}" cy="${yAt(t.score).toFixed(1)}" r="4" fill="var(--brand)" stroke="#fff" stroke-width="2"/>
    <text x="${xAt(i).toFixed(1)}" y="${(yAt(t.score) - 10).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink)" font-family="'Space Mono',monospace" font-weight="700">${t.score}</text>
    <text x="${xAt(i).toFixed(1)}" y="${h - padB + 16}" font-size="10" text-anchor="middle" fill="var(--ink-soft)" font-family="'Space Mono',monospace">${t.date.slice(5).replace('-', '/')}</text>
  `).join('');

  const groupLineHtml = (groupAvg !== undefined && groupAvg !== null) ? `
    <line x1="${padL}" y1="${yAt(groupAvg).toFixed(1)}" x2="${w - padR}" y2="${yAt(groupAvg).toFixed(1)}" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="6,4"/>
    <text x="${w - padR}" y="${(yAt(groupAvg) - 6).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--gold)" font-family="'Noto Sans KR',sans-serif" font-weight="700">그룹 평균 ${groupAvg}점</text>
  ` : '';

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
      ${gridLines}
      ${groupLineHtml}
      <path d="${pathD}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
      ${points}
    </svg>
  `;
}

function computeGroupAvgScore(studentId, data){
  if(data && data.groupAvgScore !== undefined) return data.groupAvgScore; // 서버가 계산해서 보내줘요
  const students = data.students || [];
  const student = students.find(s => s.id === studentId);
  if(!student) return null;
  const level = levelOf(student.grade);
  const groupTests = (data.dailyTests || []).filter(t => {
    const s = students.find(x => x.id === t.studentId);
    return s && levelOf(s.grade) === level;
  });
  if(groupTests.length === 0) return null;
  return Math.round(groupTests.reduce((sum, t) => sum + t.score, 0) / groupTests.length);
}

function getUnitPerformanceData(studentId, data){
  const dailyTests = data.dailyTests || [];
  const mistakeRecords = data.mistakeRecords || [];
  const MISTAKE_WARNING_THRESHOLD = 3;

  const scoreAgg = {};
  dailyTests.filter(t => t.studentId === studentId).forEach(t => {
    if(!scoreAgg[t.unit]) scoreAgg[t.unit] = { sum: 0, count: 0 };
    scoreAgg[t.unit].sum += t.score;
    scoreAgg[t.unit].count++;
  });
  const avgScoreByUnit = {};
  Object.keys(scoreAgg).forEach(u => { avgScoreByUnit[u] = Math.round(scoreAgg[u].sum / scoreAgg[u].count); });

  const mistakeByUnit = {};
  mistakeRecords.filter(m => m.studentId === studentId).forEach(m => {
    mistakeByUnit[m.unit] = (mistakeByUnit[m.unit] || 0) + 1;
  });

  const allUnits = Array.from(new Set([...Object.keys(avgScoreByUnit), ...Object.keys(mistakeByUnit)]));

  function classify(u){
    const score = avgScoreByUnit[u];
    const mistakes = mistakeByUnit[u] || 0;
    if(score !== undefined && score >= 85 && mistakes < MISTAKE_WARNING_THRESHOLD) return 'strong';
    if((score !== undefined && score < 70) || mistakes >= MISTAKE_WARNING_THRESHOLD) return 'weak';
    return 'neutral';
  }

  return { avgScoreByUnit, mistakeByUnit, allUnits, classify };
}

/* =========================================================================
   🧠 AI 학습 성향 분석 리포트 (학부모 화면)
   - 관리자 앱(imm_academy_system.html)에서 생성한 aiLearningReports 중
     이 학생의 가장 최근 리포트를 그대로 보여줘요. (원장님 상담용 내부 스크립트는
     학부모 화면에는 표시하지 않아요)

const AIRP_PALETTE = ["#F2701C","#2E9E8F","#8A6FE0","#E0546B","#C8850F","#4C8DE8","#3FB077"];

function renderAiReportSection(student, data){
  const list = (data.aiLearningReports || []).filter(r => r.studentId === student.id).slice().sort((a,b) => b.id - a.id);
  if(list.length === 0){
    return `<div class="report-empty">아직 생성된 AI 학습 성향 리포트가 없어요. 다음 상담 때 선생님께 요청해보세요!</div>`;
  }
  const entry = list[0];
  const r = entry.report;
  if(!r || !Array.isArray(r.profile)) return `<div class="report-empty">리포트를 불러오지 못했어요.</div>`;

  const total = r.profile.reduce((s,p) => s + p.percent, 0) || 100;
  const R = 60, CX = 76, CY = 76, STROKE = 22;
  const C = 2 * Math.PI * R;
  let dashOffset = 0;
  const segs = r.profile.map((p,i) => ({ ...p, color: AIRP_PALETTE[i % AIRP_PALETTE.length], len: (p.percent/total) * C }));
  const circles = segs.map(s => {

    dashOffset += s.len;
    return circle;
  }).join('');
  const dominant = [...r.profile].sort((a,b) => b.percent - a.percent)[0];

/* =========================================================================
   🧩 개념빈칸 테스트 (학생용)
   - 문제은행(conceptBankItems)·일일 출제개수(conceptDailyCounts)는
     관리자 앱(imm_academy_system.html)에서 등록한 것을 그대로 읽어와요.
   - 제출 결과는 conceptTestRecords 에 { id, studentId, date, correct, total,
     wrongItemIds, correctItemIds } 형태로 저장되어, 관리자 앱의
     "오늘의 제출 현황"에도 그대로 표시돼요 (rec.correct / rec.total 사용).
   ========================================================================= */

function getWeekKey(dateLike){
  const d = new Date(dateLike);
  const day = (d.getDay() + 6) % 7; // 월요일 = 0
  d.setDate(d.getDate() - day);
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}

function todayIsoDate(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// 관리자 앱의 getTodaysConceptItems() 와 동일한 로직 (같은 날엔 같은 문제가 나가도록)
function getTodaysConceptItemsForStudent(className, data){
  const items = (data.conceptBankItems || []).filter(i => i.className === className).sort((a,b) => a.id - b.id);
  if(items.length === 0) return [];
  if(!isConceptActiveToday(className, data)) return [];
  const perDay = (data.conceptDailyCounts && data.conceptDailyCounts[className]) || 5;
  // 2026-09-08 수정: 한국시간(KST) 자정 기준으로 하루가 바뀌도록. (예전엔 UTC 자정 기준이라
  // 한국 아침 9시에 그날 문제 세트가 또 바뀌어서, 학생이 하루에 여러 날치를 이어서 푸는
  // 것처럼 보였던 버그가 있었어요.)
  const dayIndex = Math.floor((Date.now() + 9 * 3600 * 1000) / 86400000);
  const total = items.length;
  const startIdx = (dayIndex * perDay) % total;
  const result = [];
  for(let i = 0; i < Math.min(perDay, total); i++) result.push(items[(startIdx + i) % total]);
  return result;
}

// 관리자 앱에서 설정한 요일에만 출제 (설정 안 했으면 매일)
function isConceptActiveToday(className, data){
  const activeDays = data.conceptActiveDays && data.conceptActiveDays[className];
  if(!activeDays || activeDays.length === 0) return true;
  const todayDow = new Date().getDay(); // 0=일 ... 6=토
  return activeDays.includes(todayDow);
}

// 관리자 앱에서 요일을 지정했으면 그 개수, 안 했으면 기존 기본값(3회) 유지
function getConceptWeeklyGoal(className, data){
  const activeDays = data.conceptActiveDays && data.conceptActiveDays[className];
  if(activeDays && activeDays.length > 0) return activeDays.length;
  return 3;
}

// 이 학생이 틀린 뒤 아직 한 번도 맞히지 못한 문제 id들 (기록을 시간순으로 누적/해제)
function getOutstandingWrongIds(studentId, data){
  const records = (data.conceptTestRecords || []).filter(r => r.studentId === studentId).sort((a,b) => a.id - b.id);
  const set = new Set();
  records.forEach(r => {
    (r.wrongItemIds || []).forEach(id => set.add(id));
    (r.correctItemIds || []).forEach(id => set.delete(id));
  });
  return set;
}

function buildStudentConceptQuiz(student, data){
  const bankById = {};
  (data.conceptBankItems || []).forEach(i => { bankById[i.id] = i; });

  const outstandingIds = getOutstandingWrongIds(student.id, data);
  const rotationItems = getTodaysConceptItemsForStudent(student.className, data);
  const perDay = (data.conceptDailyCounts && data.conceptDailyCounts[student.className]) || 5;

  const seen = new Set();
  const merged = [];
  Array.from(outstandingIds).forEach(id => {
    const item = bankById[id];
    if(item && item.className === student.className && !seen.has(item.id)){
      merged.push(Object.assign({}, item, { isReview:true }));
      seen.add(item.id);
    }
  });
  rotationItems.forEach(item => {
    if(!seen.has(item.id)){
      merged.push(Object.assign({}, item, { isReview:false }));
      seen.add(item.id);
    }
  });

  return merged.slice(0, Math.max(perDay, Math.min(merged.length, perDay + 3)));
}

function studentWeeklyConceptCount(studentId, data){
  const wk = getWeekKey(new Date());
  return (data.conceptTestRecords || []).filter(r => r.studentId === studentId && getWeekKey(r.date) === wk).length;
}

let conceptQuizSession = null; // { student, questions, idx, results:{} }

function renderConceptQuizDashboard(student, data){
  const weeklyGoal = getConceptWeeklyGoal(student.className, data);
  const weeklyCount = studentWeeklyConceptCount(student.id, data);
  const doneCount = Math.min(weeklyCount, weeklyGoal);

  let dots = '';
  for(let i = 0; i < weeklyGoal; i++){
    dots += `<span class="cq-dot ${i < doneCount ? 'filled' : ''}"></span>`;
  }

  const weekBlock = `
    <div class="cq-week-row">
      <div>
        <div class="cq-week-count">${weeklyCount}<span> / ${weeklyGoal}회 (이번 주)</span></div>
      </div>
      <div class="cq-dots">${dots}</div>
    </div>
    <div class="cq-status ${weeklyCount >= weeklyGoal ? 'ok' : 'pending'}">
      ${weeklyCount >= weeklyGoal ? '이번 주 목표를 달성했어요! 👍' : `수업 전까지 ${weeklyGoal - weeklyCount}회 더 풀어봐요.`}
    </div>`;

  if(!isConceptActiveToday(student.className, data)){
    return `${weekBlock}<div class="cq-empty">오늘은 개념빈칸 테스트가 없는 날이에요. 다음 출제일에 다시 확인해주세요.</div>`;
  }

  const items = buildStudentConceptQuiz(student, data);
  if(items.length === 0){
    return `${weekBlock}<div class="cq-empty">아직 우리 반에 등록된 개념빈칸 문제가 없어요. 선생님께 문의해주세요.</div>`;
  }

  const reviewCount = items.filter(i => i.isReview).length;

  return `
    ${weekBlock}
    ${reviewCount > 0 ? `<div class="cq-status pending">🔁 지난번에 틀렸던 ${reviewCount}개 문제가 오늘 다시 나와요.</div>` : ''}
    <button type="button" class="btn" onclick="startConceptQuiz(${student.id})">오늘의 문제 ${items.length}개 풀기</button>
  `;
}

function startConceptQuiz(studentId){
  const student = (currentData.students || []).find(s => s.id === studentId);
  if(!student) return;
  if(!isConceptActiveToday(student.className, currentData)) return;
  const questions = buildStudentConceptQuiz(student, currentData);
  if(questions.length === 0) return;
  conceptQuizSession = { student, questions, idx:0, results:{} };
  renderConceptQuizQuestion();
}

function renderConceptQuizQuestion(){
  const area = document.getElementById('conceptQuizArea');
  if(!area || !conceptQuizSession) return;
  const s = conceptQuizSession;
  const q = s.questions[s.idx];
  const result = s.results[q.id];
  const answered = !!result;
  const marks = ['①','②','③'];
  const pct = Math.round((s.idx / s.questions.length) * 100);

  const optionsHtml = q.choices.map((opt, i) => {
    let cls = 'cq-option';
    if(answered){
      cls += ' locked';
      if(i === q.correctIndex) cls += ' is-correct';
      else if(i === result.selectedIndex) cls += ' is-wrong-pick';
      else cls += ' dimmed';
    }
    return `
      <button type="button" class="${cls}" ${answered ? 'disabled' : ''} onclick="selectConceptOption(${i})">
        <span class="cq-mark">${marks[i] || (i+1)}</span>
        <span>${escapeHtml(opt)}</span>
      </button>`;
  }).join('');

  let feedbackHtml = '';
  if(answered){
    feedbackHtml = result.correct
      ? `<div class="cq-feedback ok">⭕ 정답이에요! <span class="cq-correct-answer">${escapeHtml(q.choices[q.correctIndex])}</span></div>`
      : `<div class="cq-feedback no">❌ 내가 고른 답 <span class="cq-student-answer">${escapeHtml(q.choices[result.selectedIndex])}</span> → 정답은 <span class="cq-correct-answer">${escapeHtml(q.choices[q.correctIndex])}</span></div>`;
  }

  const correctSoFar = Object.values(s.results).filter(r => r.correct).length;
  const answeredSoFar = Object.keys(s.results).length;

  area.innerHTML = `
    <div class="cq-progress-row">
      <div class="cq-progress-bar"><i style="width:${pct}%"></i></div>
      <div class="cq-progress-num">${s.idx+1}/${s.questions.length} · 정답 ${correctSoFar}/${answeredSoFar}</div>
    </div>
    ${q.unit ? `<span class="cq-tag">${escapeHtml(q.unit)}</span>` : ''}
    ${q.isReview ? `<span class="cq-tag review">🔁 복습</span>` : ''}
    <div class="cq-question">${escapeHtml(q.question).replace('___', '<span class="cq-blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</div>
    <div class="cq-options">${optionsHtml}</div>
    ${feedbackHtml}
    <div class="cq-nav">
      <button type="button" class="btn" ${answered ? '' : 'disabled'} onclick="goConceptNext()">${s.idx === s.questions.length-1 ? '결과 확인' : '다음 문제'}</button>
    </div>
  `;
}

function selectConceptOption(index){
  const s = conceptQuizSession;
  if(!s) return;
  const q = s.questions[s.idx];
  if(s.results[q.id]) return; // 이미 채점된 문항
  s.results[q.id] = { selectedIndex: index, correct: index === q.correctIndex };
  renderConceptQuizQuestion();
}

function goConceptNext(){
  const s = conceptQuizSession;
  if(!s) return;
  if(s.idx < s.questions.length - 1){
    s.idx += 1;
    renderConceptQuizQuestion();
  } else {
    finishConceptQuiz();
  }
}

async function finishConceptQuiz(){
  const s = conceptQuizSession;
  if(!s) return;
  const area = document.getElementById('conceptQuizArea');

  let correctCount = 0;
  const wrongItemIds = [];
  const correctItemIds = [];
  const summaryRows = [];

  s.questions.forEach(q => {
    const r = s.results[q.id] || { selectedIndex:-1, correct:false };
    if(r.correct){ correctCount++; correctItemIds.push(q.id); }
    else { wrongItemIds.push(q.id); }
    summaryRows.push(`
      <div class="cq-summary-item ${r.correct ? 'correct' : 'wrong'}">
        ${escapeHtml(q.question).replace('___', '____')}<br>
        ${r.correct
          ? `<span class="cq-correct-answer">${escapeHtml(q.choices[q.correctIndex])}</span>`
          : `<span class="cq-student-answer">${escapeHtml(q.choices[r.selectedIndex] ?? '(선택 안 함)')}</span> → <span class="cq-correct-answer">${escapeHtml(q.choices[q.correctIndex])}</span>`}
      </div>`);
  });

  if(area){
    area.innerHTML = `<div class="cq-empty">저장 중이에요...</div>`;
  }

  let saveFailed = false;
  try {
    await portalApi_('parentSubmitQuiz', { token: parentToken, studentId: s.student.id, correct: correctCount, total: s.questions.length, wrongItemIds, correctItemIds });
    delete studentDataCache[s.student.id]; // 리포트로 돌아가면 새 기록이 반영돼요
  } catch(err){
    saveFailed = true;
  }

  const studentIdForClose = s.student.id;
  conceptQuizSession = null;

  if(area){
    area.innerHTML = `
      <div class="cq-week-row">
        <div class="cq-week-count">${correctCount}<span> / ${s.questions.length} 정답</span></div>
      </div>
      ${saveFailed ? '<div class="cq-status pending">⚠️ 결과를 저장하지 못했어요. 인터넷 연결을 확인하고 다시 풀어주세요.</div>' : ''}
      ${summaryRows.join('')}
      <button type="button" class="btn ghost" onclick="showStudentReport(${studentIdForClose}).catch(err => alert(err.message))">확인했어요 · 리포트로 돌아가기</button>
    `;
  }
}

async function toggleHomeworkCheck(assignmentId, studentId, checked){
  const statusEl = document.getElementById('hwChecklistStatus');
  if(statusEl) statusEl.textContent = '저장 중...';

  try {
    await portalApi_('parentToggleHomework', { token: parentToken, studentId, assignmentId, done: !!checked });
    await showStudentReport(studentId, true);
  } catch(err){
    alert('❌ ' + err.message);
    showStudentReport(studentId, true).catch(() => {}); // 체크 표시를 서버 상태로 되돌려요
  }
}


async function submitParentMessage(studentId){
  const textEl = document.getElementById('parentMsgInput');
  const statusEl = document.getElementById('parentMsgStatus');
  const text = textEl.value.trim();

  if(!text){
    statusEl.textContent = '메시지를 입력해주세요.';
    return;
  }

  statusEl.textContent = '전송 중...';

  try {
    await portalApi_('parentSendMessage', { token: parentToken, studentId, message: text });
    await showStudentReport(studentId, true);
    const doneEl = document.getElementById('parentMsgStatus');
    if(doneEl) doneEl.textContent = '✅ 선생님께 전달했어요!';
  } catch(err){
    statusEl.textContent = '❌ ' + err.message;
  }
}
